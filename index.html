<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiet Chess</title>
    <link rel="stylesheet" href="./styles.css">
  <style>[data-kata-arcade-nav] a:focus-visible { outline: 3px solid #ffdf70 !important; outline-offset: 3px; }</style>
</head>
  <body>
    <div role="navigation" aria-label="Arcade navigation" data-kata-arcade-nav style="all:initial;display:block;position:relative;z-index:2147483647;font:600 13px/1.3 system-ui,sans-serif;">
      <a href="https://intrepion.github.io/" style="display:inline-block;margin:8px;padding:8px 12px;border:2px solid #fff;border-radius:6px;background:#17262a;color:#fff;text-decoration:underline;text-underline-offset:3px;box-shadow:0 1px 4px #0008;">← Kata Arcade</a>
    </div>

    <main class="shell">
      <section class="board-wrap" aria-label="Chess board">
        <div class="rank-files" id="board-labels"></div>
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
      </section>
      <aside class="side-panel">
        <div>
          <p class="eyebrow">Local Game</p>
          <h1>Quiet Chess</h1>
          <p id="turn-status" class="turn-status" aria-live="polite">White to move</p>
        </div>
        <div class="controls">
          <button id="new-game" type="button">New Game</button>
          <button id="flip-board" type="button">Flip</button>
          <button id="undo-move" type="button">Undo</button>
          <button id="mute-sound" type="button" aria-pressed="false">Mute</button>
        </div>
        <section>
          <h2>Captured Pieces</h2>
          <div id="captured-pieces" class="captured" aria-live="polite">None</div>
        </section>
        <section>
          <h2>Move History</h2>
          <ol id="move-history" class="move-history"></ol>
        </section>
        <section>
          <h2>FEN</h2>
          <textarea id="fen-box" spellcheck="false" rows="3" aria-label="FEN position"></textarea>
          <div class="controls">
            <button id="copy-fen" type="button">Copy FEN</button>
            <button id="load-fen" type="button">Load FEN</button>
          </div>
        </section>
      </aside>
    </main>
    <div id="promotion-modal" class="promotion-modal" hidden>
      <div class="promotion-card" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
        <h2 id="promotion-title">Choose Promotion</h2>
        <div id="promotion-choices" class="promotion-choices"></div>
      </div>
    </div>
    <div id="aria-status" class="sr-only" aria-live="assertive"></div>
    <pre id="debug-state" hidden></pre>
    <script src="./vendor/chess-vendor.js"></script>
    <script src="./chess-rules.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
